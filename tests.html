<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Grain geometry checks</title><script src="generators.js"></script><script src="taste.js"></script></head>
<body>
<h1>Grain geometry checks</h1><pre id="results">Running...</pre>
<script>
"use strict";
const G = window.Grain, results = [], failures = [], pendingTests = [];
function assert(condition, message) { if (!condition) throw new Error(message); }
function test(name, run) {
  try {
    const result=run();
    if(result&&typeof result.then==="function"){
      pendingTests.push(result.then(()=>results.push("PASS "+name),error=>{
        results.push("FAIL "+name+": "+error.message);failures.push(name);
      }));
    }else results.push("PASS " + name);
  }
  catch (error) { results.push("FAIL " + name + ": " + error.message); failures.push(name); }
}
function cross(a,b,c) { return (b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]); }
function intersects(a,b,c,d) {
  return cross(a,b,c)*cross(a,b,d)<-1e-12 && cross(c,d,a)*cross(c,d,b)<-1e-12;
}
const legacyBase = {style:"ripple",seed:"river-042",width:10,height:8,density:26,movement:62};
for (const style of ["ripple", "contour", "flow", "bloom"]) {
  test(style + " deterministic SVG and correct physical dimensions", () => {
    const s = {...legacyBase,style,seed:'a<&"seed',width:7.25,height:5.5};
    const svg = G.exportSVG(s);
    assert(svg === G.exportSVG(s), "Different output for identical settings");
    const xml = new DOMParser().parseFromString(svg,"image/svg+xml");
    assert(!xml.querySelector("parsererror"), "Invalid SVG XML");
    assert(xml.documentElement.getAttribute("width")==="7.25in", "Wrong width");
    assert(xml.documentElement.getAttribute("height")==="5.5in", "Wrong height");
    assert(xml.documentElement.getAttribute("viewBox")==="0 0 7.25 5.5", "Wrong viewBox");
    assert(xml.querySelector("#cut rect"), "Missing boundary");
    assert(xml.querySelector("#cut").getAttribute("stroke")==="#ff0000", "Wrong cut color");
    if (G.styles[style].operation==="score") assert(xml.querySelector("#score").getAttribute("stroke")==="#0000ff","Wrong score color");
    assert(!xml.querySelector("mask,pattern,image,script"), "Preview content leaked into export");
    const storedSettings = JSON.parse(xml.querySelector("desc").textContent.slice(0, JSON.stringify(s).length));
    assert(storedSettings.seed === s.seed, "Seed did not survive XML escaping");
    assert(svg !== G.exportSVG({...s,seed:"different"}), "Seed has no effect");
  });
  test(style + " extreme sizes and movements remain inside frame", () => {
    for (const [width,height] of [[2,2],[19,2],[2,10.5],[19,10.5],[10,8]]) {
      for (const movement of [0,100]) for (const density of [8,48]) for (const seed of ["fern","moss","dune"]) {
        const d = G.generate({...legacyBase,style,width,height,movement,density,seed});
        for (const shape of d.shapes) for (const [x,y] of shape.points) {
          assert(Number.isFinite(x) && Number.isFinite(y), "Nonfinite coordinate");
          assert(x>=d.margin-1e-6 && x<=width-d.margin+1e-6 && y>=d.margin-1e-6 && y<=height-d.margin+1e-6, "Shape leaves frame");
        }
        if (style==="ripple") assert(d.metrics.minimumHorizontalWeb>=0.08-1e-8,"Web below 0.08 in");
        if (G.styles[style].operation==="cut") assert(d.shapes.every(p=>p.closed),"Open cutout");
        if (style==="flow") {
          for (let i=1;i<d.shapes.length;i++) for (let k=0;k<d.shapes[i].points.length;k++)
            assert(d.shapes[i].points[k][1]>d.shapes[i-1].points[k][1],"Flow lines cross");
        }
        if (style==="ripple") {
          for (let i=1;i<d.shapes.length;i++) for (let k=1;k<100;k++)
            assert(d.shapes[i].points[k][0]-d.shapes[i-1].points[200-k][0]>=0.08-1e-8,"Adjacent slots overlap or undershoot web");
        }
      }
    }
  });
  test(style + " no self-intersections", () => {
    const d=G.generate({...legacyBase,style,movement:100,density:48});
    for (const shape of d.shapes) {
      const p=shape.points, end=shape.closed?p.length:p.length-1;
      for(let i=0;i<end;i++) for(let j=i+2;j<end;j++) {
        if(shape.closed && i===0 && j===end-1) continue;
        assert(!intersects(p[i],p[(i+1)%p.length],p[j],p[(j+1)%p.length]),"Self-intersection");
      }
    }
  });
}
      function pointDistance(p,a,b) {
        const dx=b[0]-a[0],dy=b[1]-a[1],length=dx*dx+dy*dy;
        const t=length?Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/length)):0;
        return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy);
      }
      function bounds(p) {
        return [Math.min(...p.map(v=>v[0])),Math.min(...p.map(v=>v[1])),Math.max(...p.map(v=>v[0])),Math.max(...p.map(v=>v[1]))];
      }
      function contains(p,q) {
        let inside=false;
        for(let i=0,j=p.length-1;i<p.length;j=i++) {
          const a=p[i],b=p[j];
          if((a[1]>q[1])!==(b[1]>q[1]) && q[0]<(b[0]-a[0])*(q[1]-a[1])/(b[1]-a[1])+a[0]) inside=!inside;
        }
        return inside;
      }
      function audit(d) {
        const shapes=d.shapes, boxes=shapes.map(s=>bounds(s.points)), web=d.metrics.reservedWeb;
        assert(shapes.length>0,"No cutouts");
        for(const shape of shapes) {
          assert(shape.closed && shape.operation==="cut","Recipe emitted score line or open cut");
          for(const [x,y] of shape.points) assert(Number.isFinite(x)&&Number.isFinite(y)&&x>=d.margin-1e-6&&y>=d.margin-1e-6&&x<=d.settings.width-d.margin+1e-6&&y<=d.settings.height-d.margin+1e-6,"Outside frame");
          const p=shape.points;
          for(let i=0;i<p.length;i++)for(let j=i+2;j<p.length;j++) {
            if(i===0&&j===p.length-1)continue;
            assert(!intersects(p[i],p[(i+1)%p.length],p[j],p[(j+1)%p.length]),"Self-intersecting cutout");
          }
        }
        for(let i=0;i<shapes.length;i++)for(let j=i+1;j<shapes.length;j++) {
          const a=boxes[i],b=boxes[j],dx=Math.max(0,a[0]-b[2],b[0]-a[2]),dy=Math.max(0,a[1]-b[3],b[1]-a[3]);
          if(Math.hypot(dx,dy)>=web)continue;
          const p=shapes[i].points,q=shapes[j].points;
          assert(!contains(p,q[0])&&!contains(q,p[0]),"Nested/overlapping holes");
          for(let k=0;k<p.length;k++)for(let l=0;l<q.length;l++){
            const pa=p[k],pb=p[(k+1)%p.length],qa=q[l],qb=q[(l+1)%q.length];
            assert(!intersects(pa,pb,qa,qb),"Cutouts cross");
            const distance=Math.min(pointDistance(pa,qa,qb),pointDistance(pb,qa,qb),pointDistance(qa,pa,pb),pointDistance(qb,pa,pb));
            assert(distance>=web-0.00003,`Web ${distance.toFixed(5)} below ${web} (${d.settings.recipe.layout})`);
          }
        }
      }
      for(const layout of Object.keys(G.recipeOptions.layout)) {
        test(layout+" new recipes: closed cutouts, real spacing, no intersections",()=>{
          for(const motif of ["facets","stars","soft","leaves","tracery"]) {
            const s=G.invent("check-"+layout+"-"+motif,{...G.defaults,density:16});
            s.recipe.layout=layout;s.recipe.motif=motif;s.recipe.field="vortex";s.recipe.twist=2.8;s.movement=100;s.density=16;
            try {audit(G.generate(s));}
            catch(error) {if(error instanceof G.GeometryError&&layout==="triangles"&&motif==="tracery")continue;throw error;}
          }
        });
      }
      test("small, narrow, and wide panels retain webs or explicitly reject empty geometry",()=>{
        for(const [width,height] of [[2,2],[19,2],[2,10.5]])for(const layout of Object.keys(G.recipeOptions.layout)){
          const s=G.invent("extreme-"+layout,{...G.defaults,width,height});s.recipe.layout=layout;s.recipe.motif="facets";s.web=0.3;s.density=48;s.movement=100;
          try{audit(G.generate(s));}catch(error){if(!(error instanceof G.GeometryError))throw error;}
        }
      });
      test("explorer SVG dimensions, recipe round-trip, and no decorative content",()=>{
        const s=G.validate({...G.defaults,seed:'test<&"seed',width:7.25,height:5.5});
        const svg=G.exportSVG(s),xml=new DOMParser().parseFromString(svg,"image/svg+xml");
        assert(!xml.querySelector("parsererror"),"Invalid XML");
        assert(xml.documentElement.getAttribute("width")==="7.25in"&&xml.documentElement.getAttribute("height")==="5.5in","Physical scale wrong");
        assert(!xml.querySelector("#score,mask,pattern,image,script"),"Score/preview content in cut-only export");
        const stored=JSON.parse(xml.querySelector("desc").textContent.slice(0,JSON.stringify(s).length));
        assert(G.exportSVG(stored)===svg,"Recipe export not reproducible");
        assert(xml.querySelectorAll("#cut path").length===G.generate(s).shapes.length,"Preview/export cut counts differ");
      });
      test("discovery changes compositions, not only seeds",()=>{
        const signatures=new Set(),outputs=new Set();let usable=0;
        for(let i=0;i<100;i++){
          const s=G.invent("idea-"+i),r=s.recipe;
          signatures.add([r.layout,r.motif,r.field,r.rhythm].join("/"));
          try{outputs.add(G.generate(s).shapes.map(p=>p.d).join(""));usable++;}catch(error){if(!(error instanceof G.GeometryError))throw error;}
        }
        assert(signatures.size>=70,"Fewer than 70 structural combinations in 100 ideas");
        assert(usable>=80&&outputs.size===usable,"Too few usable or distinct ideas");
        assert(JSON.stringify(G.invent("stable"))===JSON.stringify(G.invent("stable")),"Recipe invention not deterministic");
      });
      test("related exploration and directions preserve their intended scope",()=>{
        const s=G.invent("related",G.defaults,"all",true);
        assert(s.recipe.layout===G.defaults.recipe.layout&&s.recipe.motif===G.defaults.recipe.motif,"Related structure changed");
        for(const direction of ["geometry","organic","optical"])for(let i=0;i<10;i++) G.validate(G.invent(direction+i,G.defaults,direction));
      });
test("interrupted ribbon tips stay finite and retain separation", () => {
  for (const seed of ["probe-8", "probe-18", "ribbon-breaks"]) {
    const s = G.invent(seed);
    s.recipe.layout = "ribbons"; s.recipe.rhythm = "bands";
    audit(G.generate(s));
  }
});
function measuredPath(shape) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg"), p = document.createElementNS(svg.namespaceURI,"path");
  p.setAttribute("d",shape.d);svg.append(p);
  assert(Number.isFinite(p.getTotalLength())&&p.getTotalLength()>0,"Browser could not measure the actual SVG path");
  return { path:p, remove:()=>svg.remove() };
}
test("rounded exports contain actual continuous curves, not polygon edges",()=>{
  const d=G.generate({...G.defaults,recipe:{...G.defaults.recipe,motif:"soft",roundness:100}});
  const xml=new DOMParser().parseFromString(G.exportSVG(d.settings),"image/svg+xml");
  for(const p of xml.querySelectorAll("#cut path")) assert(p.getAttribute("d").includes("C")&&!/[LQ]/.test(p.getAttribute("d")),"Organic export still follows individual polygon corners");
  for(const shape of d.shapes.slice(0,5)){
    const measured=measuredPath(shape),length=measured.path.getTotalLength();
    try{
      for(let i=0;i<100;i++){
        const q=measured.path.getPointAtLength(length*i/100),p=[q.x,q.y];
        assert(contains(shape.envelope,p)||shape.envelope.some((a,k)=>pointDistance(p,a,shape.envelope[(k+1)%shape.envelope.length])<0.00003),"Exported curve leaves its reserved cell");
      }
    }finally{measured.remove();}
  }
});
test("organic contours have continuous tangent and curvature even on uneven cells",()=>{
  const d=G.generate({...G.defaults,movement:150,recipe:{...G.defaults.recipe,layout:"scatter",jitter:0.2}});
  for(const shape of d.shapes){
    assert(shape.minRadius>=shape.targetRadius&&!shape.pinched,"A smooth but needle-like organic tip was retained");
    const initial=shape.d.match(/^M([-\d.]+),([-\d.]+)/);
    let start=[Number(initial[1]),Number(initial[2])];
    const segments=Array.from(shape.d.matchAll(/C([-\d.]+),([-\d.]+) ([-\d.]+),([-\d.]+) ([-\d.]+),([-\d.]+)/g),m=>{
      const segment=[start,[Number(m[1]),Number(m[2])],[Number(m[3]),Number(m[4])],[Number(m[5]),Number(m[6])]];
      start=segment[3];return segment;
    });
    assert(segments.length>0,"No globally smooth contour");
    for(let i=0;i<segments.length;i++){
      const a=segments[i],b=segments[(i+1)%segments.length];
      for(let axis=0;axis<2;axis++){
        assert(Math.abs((a[3][axis]-a[2][axis])-(b[1][axis]-b[0][axis]))<0.00004,"Tangent jumps at contour join");
        assert(Math.abs((a[3][axis]-2*a[2][axis]+a[1][axis])-(b[2][axis]-2*b[1][axis]+b[0][axis]))<0.00006,"Curvature pinches at contour join");
      }
    }
  }
  audit(d);
});
test("true ellipse SVG arcs satisfy the ellipse equation",()=>{
  const s={...G.defaults,recipe:{...G.defaults.recipe,motif:"ovals",shapeAspect:1.8,phase:0.4}};
  const d=G.generate(s);
  for(const shape of d.shapes.slice(0,5)){
    assert(shape.d.includes("A")&&!/[LQ]/.test(shape.d),"Ellipse exported as an approximation");
    const e=shape.ellipse,measured=measuredPath(shape),length=measured.path.getTotalLength();
    try{
      for(let i=0;i<80;i++){
        const q=measured.path.getPointAtLength(length*i/80),dx=q.x-e.cx,dy=q.y-e.cy;
        const x=dx*Math.cos(e.rotation)+dy*Math.sin(e.rotation),y=-dx*Math.sin(e.rotation)+dy*Math.cos(e.rotation);
        // Browser geometry APIs approximate conics; verify exact SVG centers below.
        assert(Math.abs(x*x/(e.rx*e.rx)+y*y/(e.ry*e.ry)-1)<0.0006,"Rendered arc departs from the ellipse");
      }
    }finally{measured.remove();}
    const initial=shape.d.match(/^M([-\d.]+),([-\d.]+)/);
    let start=[Number(initial[1]),Number(initial[2])];
    for(const arc of shape.d.matchAll(/A([-\d.]+),([-\d.]+) ([-\d.]+) 0 1 ([-\d.]+),([-\d.]+)/g)){
      const rx=Number(arc[1]),ry=Number(arc[2]),a=Number(arc[3])*Math.PI/180,end=[Number(arc[4]),Number(arc[5])];
      const dx=(start[0]-end[0])/2,dy=(start[1]-end[1])/2,x=dx*Math.cos(a)+dy*Math.sin(a),y=-dx*Math.sin(a)+dy*Math.cos(a);
      const coefficient=Math.sqrt(Math.max(0,(rx*rx*ry*ry-rx*rx*y*y-ry*ry*x*x)/(rx*rx*y*y+ry*ry*x*x)));
      const cx=coefficient*rx*y/ry,cy=-coefficient*ry*x/rx;
      const centerX=cx*Math.cos(a)-cy*Math.sin(a)+(start[0]+end[0])/2,centerY=cx*Math.sin(a)+cy*Math.cos(a)+(start[1]+end[1])/2;
      assert(Math.hypot(centerX-e.cx,centerY-e.cy)<0.0000001,"Arc centers drift apart");
      start=end;
    }
  }
  audit(d);
});
test("extended movement and independent tracery controls preserve real webs",()=>{
  const base=G.validate(G.defaults);
  for(const outline of Object.keys(G.traceOutlines)){
    const s={...base,movement:180,web:0.18,recipe:{...base.recipe,motif:"tracery",traceOutline:outline,traceWeb:0.08,traceHub:10,symmetry:6,roundness:100}};
    audit(G.generate(s));
  }
  const a=G.generate({...base,recipe:{...base.recipe,motif:"tracery",traceHub:0}});
  const b=G.generate({...base,recipe:{...base.recipe,motif:"tracery",traceHub:45}});
  assert(a.metrics.openFraction>b.metrics.openFraction,"Hub control has no meaningful area effect");
});
test("balance reaches a measurable target and reports unreachable requests",()=>{
  const result=G.balance(G.defaults,0.48);
  assert(result.reached&&Math.abs(G.generate(result.settings).metrics.openFraction-0.48)<0.01,"Balance did not reach target");
  const sparse={...G.defaults,recipe:{...G.defaults.recipe,motif:"leaves",shapeAspect:0.3}};
  const impossible=G.balance(sparse,0.75);
  assert(!impossible.reached&&impossible.achieved<0.75,"Unreachable target reported as success");
  assert(G.generate({...G.defaults,openness:100}).metrics.openFraction>G.generate({...G.defaults,openness:80}).metrics.openFraction+0.1,"Opening range cannot fill the design");
});
test("four panels interpolate one parameter and keep all other settings",()=>{
  const panels=G.evolve(G.defaults,"movement",0,180);
  assert(panels.length===4,"Wrong panel count");
  const recipes=panels.map(p=>JSON.stringify(p.design.settings.recipe));
  assert(new Set(recipes).size===1,"Recipe changed across panels");
  assert(panels.every((p,i)=>p.value===i*60&&p.design.settings.seed===G.defaults.seed),"Incorrect equal progression or changed seed");
  assert(new Set(panels.map(p=>p.design.shapes.map(s=>s.d).join(""))).size===4,"Panels do not actually evolve");
  for(const panel of panels){
    const xml=new DOMParser().parseFromString(G.exportSVG(panel.design.settings),"image/svg+xml");
    assert(xml.documentElement.getAttribute("width")==="10in"&&xml.documentElement.getAttribute("height")==="8in","Panel export uses combined-sheet dimensions");
  }
  let rejected=false;try{G.evolve({...G.defaults,recipe:{...G.defaults.recipe,field:"still"}},"movement",0,100);}catch{rejected=true;}
  assert(rejected,"No-effect evolution accepted silently");
});
test("version 2 favorites retain polygons until an explicit upgrade",()=>{
  const v2={style:"explore",seed:"courtyard-008",width:10,height:8,density:26,movement:62,web:0.14,openness:86,recipe:{layout:"quilt",motif:"tracery",field:"vortex",rhythm:"gradient",symmetry:8,frequency:1.4,twist:1.8,aspect:1,focusX:0.5,focusY:0.5,phase:0.8}};
  const old=G.exportSVG(v2),upgraded=G.upgrade(v2);
  assert(G.generate(v2).shapes.length===123,"Version 2 prototype geometry changed");
  assert(!G.generate(v2).shapes.some(p=>p.d.includes("Q")),"Version 2 was silently upgraded");
  assert(upgraded.version===4&&G.generate(upgraded).shapes.some(p=>/[CQ]/.test(p.d)),"Upgrade did not add curves");
  assert(G.exportSVG(v2)===old,"Upgrade mutated original favorite");
});
test("ratings and comparisons round-trip, distinguish taste, and reject invalid records",()=>{
  const T=window.GrainTaste,a=G.validate(G.defaults),b=G.validate({...G.defaults,recipe:{...G.defaults.recipe,layout:"radial",motif:"stars",field:"still"}});
  const common={createdAt:"2026-11-26T17:00:00.000Z"};
  const collection=T.validate({version:1,useFeedback:true,entries:[{...common,id:"rating-a",kind:"rating",study:a,rating:9},{...common,id:"rating-b",kind:"rating",study:b,rating:2},{...common,id:"choice",kind:"comparison",left:a,right:b,choice:"left"}]});
  assert(T.score(a,collection)>T.score(b,collection),"Feedback does not influence recipe ranking");
  const restored=T.validate(JSON.parse(T.exportJSON(collection)));
  assert(JSON.stringify(restored)===JSON.stringify(collection),"Feedback export lost ratings or recipes");
  for(const rating of [-1,11,NaN]){
    let rejected=false;try{T.validate({version:1,entries:[{...common,id:"bad",kind:"rating",study:a,rating}]});}catch{rejected=true;}
    assert(rejected,"Invalid score accepted");
  }
});
test("taste sketches are observably different and freshly procedural",()=>{
  const T=window.GrainTaste,original=JSON.stringify(G.defaults);
  for(let i=0;i<6;i++){
    const a=T.pair("taste-contrast-"+i,i),b=T.pair("taste-fresh-"+i,i);

    assert(JSON.stringify(a)===JSON.stringify(T.pair("taste-contrast-"+i,i)),"Same comparison seed is not reproducible");

test("version 3 archived SVG remains byte-for-byte stable",()=>{
  const s={...G.defaults,version:3},svg=G.exportSVG(s);
  let hash=2166136261;for(const c of svg)hash=Math.imul(hash^c.charCodeAt(0),16777619);
  assert(G.generate(s).shapes.length===58&&(hash>>>0)===1531638711,"Archived version 3 geometry changed");
  assert(G.upgrade(s).version===4&&G.exportSVG(s)===svg,"Explicit upgrade mutated the archive");
});
for(const family of Object.keys(G.families)){
  test(family+" 100 seeds: actual SVG curves, spacing, containment, and reproducibility",async()=>{
    for(let seed=0;seed<100;seed++){
      await new Promise(resolve=>setTimeout(resolve,0));
      const s=G.curate("reset-audit-"+seed,family),d=G.generate(s);
      const shapes=d.shapes.map(shape=>{
        const measured=measuredPath(shape),length=measured.path.getTotalLength();
        try{
          const points=Array.from({length:96},(_,i)=>{
            const q=measured.path.getPointAtLength(length*i/96);return [q.x,q.y];
          });
          if(shape.envelope)for(const p of points)assert(contains(shape.envelope,p)||shape.envelope.some((a,k)=>pointDistance(p,a,shape.envelope[(k+1)%shape.envelope.length])<0.00003),"Actual curve leaves reserved envelope");
          return {...shape,points};
        }finally{measured.remove();}
      });
      audit({...d,shapes});
      const xml=new DOMParser().parseFromString(G.exportSVG(s),"image/svg+xml");
      const paths=[...xml.querySelectorAll("#cut path")].map(p=>p.getAttribute("d"));
      assert(JSON.stringify(paths)===JSON.stringify(d.shapes.map(p=>p.d)),"Export differs from preview geometry");
      assert(xml.documentElement.getAttribute("width")==="10in"&&xml.documentElement.getAttribute("height")==="8in","Wrong true size");
      assert(JSON.stringify(G.curate("reset-audit-"+seed,family))===JSON.stringify(s),"Curated recipe changed for same seed");
    }
  });
}
test("every offered slider has observable effects over five points of its range",()=>{
  const context=document.createElement("canvas").getContext("2d");
  for(const family of Object.keys(G.families))for(const [key,,min,max,step] of G.families[family].controls){
    let previous=null;
    for(let i=0;i<5;i++){
      const s=G.starting(family),value=min+Math.round((max-min)*i/4/step)*step;
      if(key in s)s[key]=value;else s.recipe[key]=value;
      const d=G.generate(s),paths=d.shapes.map(shape=>new Path2D(shape.d)),samples=[];
      for(let y=0;y<60;y++)for(let x=0;x<75;x++)samples.push(paths.some(p=>context.isPointInPath(p,(x+.5)*s.width/75,(y+.5)*s.height/60)));
      if(previous){
        const changed=samples.filter((v,k)=>v!==previous[k]).length/samples.length;
        assert(changed>=0.015,`${family}/${key}: only ${(changed*100).toFixed(1)}% sampled occupancy change at ${value}`);
      }
      previous=samples;
    }
  }
});
test("gallery breadth, semantic novelty, and explicit choices preserve earlier ratings",()=>{
  const T=window.GrainTaste,first=T.gallery("gallery-first"),second=T.gallery("gallery-second",first.descriptors);
  assert(first.designs.length===12&&second.designs.length===12,"Gallery lost broad coverage");
  const all=[...first.descriptors,...second.descriptors];
  for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++)assert(T.distinct(all[i],all[j]),"Similar composition profiles repeated");
  for(const family of Object.keys(G.families))assert(first.descriptors.filter(d=>d.family===family).length===3,"Missing offered family");
  const common={createdAt:"2026-11-26T17:00:00.000Z"};
  const prior={...common,id:"prior",kind:"rating",rating:3,study:{...G.defaults,version:3}};
  const record={...common,id:"gallery",kind:"gallery",none:false,studies:first.designs.map((d,i)=>({study:d.settings,choice:i===0?"favorite":i===1?"dislike":"unrated"}))};
  const collection=T.validate({version:1,entries:[prior,record]});
  assert(JSON.stringify(T.validate(JSON.parse(T.exportJSON(collection))))===JSON.stringify(collection),"Gallery export lost choices or prior ratings");
  const none=T.validate({version:1,entries:[{...record,none:true,studies:record.studies.map(item=>({...item,choice:"unrated"}))}]});
  assert(T.score(G.defaults,none)===0,"None was mistaken for an inferred rating");
});
test("every cell-detail stop changes the lattice rather than landing on a dead interval",()=>{
  for(const family of ["whirl","crystal","orbit"]){
    const [key,,min,max,step]=G.families[family].controls[0],paths=new Set();
    for(let value=min;value<=max;value+=step){
      const s=G.starting(family);s[key]=value;
      paths.add(G.generate(s).shapes.map(p=>p.d).join("|"));
    }
    assert(paths.size===(max-min)/step+1,`${family}: an offered detail stop has no effect`);
  }
});
test("organic fields omit specks and slivers far smaller than their neighbours",()=>{
  const perimeter=pts=>pts.reduce((sum,p,k)=>sum+Math.hypot(p[0]-pts[(k+1)%pts.length][0],p[1]-pts[(k+1)%pts.length][1]),0);
  const shoelace=pts=>Math.abs(pts.reduce((sum,p,k)=>sum+p[0]*pts[(k+1)%pts.length][1]-pts[(k+1)%pts.length][0]*p[1],0))/2;
  let checked=0;
  for(const family of ["whirl","orbit"])for(let i=0;i<40;i++){
    const d=G.generate(G.curate(`fragment-${family}-${i}`,family));
    const areas=d.shapes.map(s=>s.analyticArea??shoelace(s.points)),thick=d.shapes.map((s,k)=>2*areas[k]/perimeter(s.points));
    const median=v=>[...v].sort((a,b)=>a-b)[v.length>>1],ma=median(areas),mt=median(thick);
    areas.forEach((a,k)=>{checked++;assert(a>=ma*0.15*0.999&&thick[k]>=mt*0.4*0.999,`${family} ${i}: opening ${k} is an isolated fragment`);});
  }
  assert(checked>500,"Too few openings checked");
  const archived=G.generate({...G.defaults,version:3});
  assert(archived.shapes.length===58,"Archived version 3 recipes must keep their fragments");
});
